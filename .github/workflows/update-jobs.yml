name: Update job snapshot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_jobs.py
      - run: |
          git config user.name "career-compass-bot"
          git config user.email "career-compass-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Update job snapshot"
          git push
